<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Quyển sách mở dưới ngôi sao, vòng sáng lan tỏa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3b20"/>
      <stop offset="0.55" stop-color="#073018"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="400" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#22c55e" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3fdf6"/>
      <stop offset="0.75" stop-color="#e2f6e8"/>
      <stop offset="1" stop-color="#b4e0c3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15803d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#052e16" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>

  <!-- Vòng tròn đồng tâm quanh quyển sách -->
  <g fill="none" stroke="#86efac">
    <circle cx="400" cy="400" r="130" stroke-opacity="0.22"/>
    <circle cx="400" cy="400" r="210" stroke-opacity="0.16"/>
    <circle cx="400" cy="400" r="295" stroke-opacity="0.11"/>
    <circle cx="400" cy="400" r="385" stroke-opacity="0.07"/>
    <circle cx="400" cy="400" r="210" stroke-opacity="0.35" stroke-dasharray="2 14" stroke-linecap="round" stroke-width="3"/>
  </g>

  <!-- Tia sáng từ ngôi sao -->
  <g stroke="#fde68a" stroke-linecap="round" stroke-opacity="0.5">
    <line x1="400" y1="212" x2="400" y2="176" stroke-width="3"/>
    <line x1="338" y1="238" x2="314" y2="212" stroke-width="3"/>
    <line x1="462" y1="238" x2="486" y2="212" stroke-width="3"/>
    <line x1="298" y1="296" x2="262" y2="288" stroke-width="2.5" stroke-opacity="0.35"/>
    <line x1="502" y1="296" x2="538" y2="288" stroke-width="2.5" stroke-opacity="0.35"/>
  </g>

  <!-- Ngôi sao -->
  <polygon points="400.0,252.0 411.2,284.6 445.7,285.2 418.1,305.9 428.2,338.8 400.0,319.0 371.8,338.8 381.9,305.9 354.3,285.2 388.8,284.6" fill="url(#gold)" stroke="#fde68a" stroke-width="2" stroke-linejoin="round"/>

  <!-- Quyển sách mở -->
  <g>
    <ellipse cx="400" cy="590" rx="250" ry="22" fill="#000" fill-opacity="0.3"/>
    <defs>
      <path id="pg" d="M184 394 C264 376 342 384 400 416 L400 534 C342 502 264 494 184 512 Z"/>
      <g id="half">
        <!-- bìa -->
        <path d="M164 402 C250 380 338 390 400 426 L400 558 C338 522 250 512 164 534 Z" fill="#14532d"/>
        <path d="M164 534 C250 512 338 522 400 558" fill="none" stroke="#4ade80" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round"/>
        <path d="M164 402 L164 534" fill="none" stroke="#22c55e" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"/>
        <!-- các lớp giấy phía dưới: cho thấy độ dày -->
        <use href="#pg" y="14" fill="#8fcda5"/>
        <use href="#pg" y="9" fill="#a9dbb9"/>
        <use href="#pg" y="4.5" fill="#c3e8cf"/>
        <path d="M184 526 C264 508 342 516 400 548 M184 521 C264 503 342 511 400 543 M184 516.500 C264 498.500 342 506.500 400 538.500" fill="none" stroke="#5aa874" stroke-opacity="0.55" stroke-width="1.5"/>
        <!-- trang trên cùng -->
        <use href="#pg" fill="url(#page)"/>
        <g stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-opacity="0.55" fill="none">
          <path d="M218 424 C266 414 320 420 366 440"/>
          <path d="M218 450 C266 440 320 446 366 466"/>
          <path d="M218 476 C266 466 320 472 366 492" stroke-opacity="0.3"/>
        </g>
      </g>
    </defs>
    <use href="#half"/>
    <use href="#half" transform="translate(800 0) scale(-1 1)"/>
    <!-- gáy sách -->
    <path d="M400 416 L400 534" stroke="#2f7d4a" stroke-opacity="0.55" stroke-width="6" stroke-linecap="round"/>
    <path d="M400 416 L400 534" stroke="#effcf3" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- dải ruy băng đánh dấu trang -->
    <path d="M386 520 L414 520 L414 598 L400 584 L386 598 Z" fill="url(#gold)" stroke="#f59e0b" stroke-opacity="0.6"/>
  </g>

  <!-- Thẻ biểu đồ tiến độ (trái) -->
  <g transform="translate(96 232)">
    <rect width="148" height="104" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.35"/>
    <g fill="#86efac">
      <rect x="22" y="56" width="18" height="30" rx="5" fill-opacity="0.45"/>
      <rect x="50" y="42" width="18" height="44" rx="5" fill-opacity="0.65"/>
      <rect x="78" y="28" width="18" height="58" rx="5" fill-opacity="0.85"/>
      <rect x="106" y="16" width="18" height="70" rx="5"/>
    </g>
  </g>

  <!-- Bong bóng hỏi đáp (phải) -->
  <g transform="translate(548 196)">
    <path d="M24 0 H128 A24 24 0 0 1 152 24 V64 A24 24 0 0 1 128 88 H64 L36 112 L40 88 H24 A24 24 0 0 1 0 64 V24 A24 24 0 0 1 24 0 Z" fill="#ffffff" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.35"/>
    <g fill="#86efac">
      <circle cx="46" cy="44" r="7" fill-opacity="0.9"/>
      <circle cx="76" cy="44" r="7" fill-opacity="0.65"/>
      <circle cx="106" cy="44" r="7" fill-opacity="0.4"/>
    </g>
  </g>

  <!-- Vòng hoàn thành (phải, dưới) -->
  <g transform="translate(656 640)">
    <circle r="46" fill="#ffffff" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.35"/>
    <circle r="30" fill="none" stroke="#86efac" stroke-opacity="0.25" stroke-width="7"/>
    <circle r="30" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-dasharray="141 189" transform="rotate(-90)"/>
    <path d="M-10 1 L-2 10 L12 -8" fill="none" stroke="#bbf7d0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Thẻ ghi nhớ nhỏ (trái, dưới) -->
  <g transform="translate(96 650) rotate(-8)">
    <rect width="104" height="70" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#86efac" stroke-opacity="0.35"/>
    <g stroke="#86efac" stroke-width="5" stroke-linecap="round">
      <line x1="20" y1="24" x2="70" y2="24" stroke-opacity="0.8"/>
      <line x1="20" y1="42" x2="84" y2="42" stroke-opacity="0.45"/>
    </g>
  </g>

  <!-- Chấm sáng rải rác -->
  <g fill="#bbf7d0">
    <circle cx="64" cy="120" r="3" fill-opacity="0.6"/>
    <circle cx="170" cy="168" r="2" fill-opacity="0.5"/>
    <circle cx="700" cy="150" r="3" fill-opacity="0.6"/>
    <circle cx="742" cy="330" r="2" fill-opacity="0.5"/>
    <circle cx="70" cy="470" r="2.5" fill-opacity="0.5"/>
    <circle cx="720" cy="450" r="2" fill-opacity="0.4"/>
    <circle cx="300" cy="120" r="2" fill-opacity="0.5"/>
    <circle cx="520" cy="110" r="2.5" fill-opacity="0.5"/>
  </g>

  <!-- Đồi xanh phía dưới -->
  <path d="M0 760 C140 700 270 700 400 740 C540 784 680 760 800 700 V1000 H0 Z" fill="url(#hill)"/>
  <path d="M0 830 C160 780 300 800 430 836 C570 874 690 850 800 800 V1000 H0 Z" fill="#0b3b20" fill-opacity="0.7"/>
</svg>
