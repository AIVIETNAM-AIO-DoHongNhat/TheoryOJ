<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Con đường lên đỉnh núi qua sáu cột mốc chương, ba chương đầu đã hoàn thành, chương bốn đang học, ngôi sao vàng trên đỉnh">
  <!--
    Con đường chinh phục kiến thức: sáu cột mốc là sáu chương. Đoạn đã đi sáng lên, đoạn phía trước nét đứt;
    ngôi sao trên đỉnh là mục tiêu, bong bóng chat cạnh chặng đang học là trợ lý. Phần dưới để tối vì có thẻ lợi ích
    đè lên (AuthPage.tsx). Sinh bằng script, chỉnh tọa độ trong script rồi sinh lại thay vì sửa tay.
  -->
  <style>
    .num { font: 700 20px "Roboto Condensed", "Segoe UI", Roboto, Arial, sans-serif; }
    .num.small { font-size: 14px; }
    .tw { fill: #d9f99d; animation: tw 4s ease-in-out infinite; }
    .tw.d1 { animation-delay: -1.3s; fill: #bbf7d0; }
    .tw.d2 { animation-delay: -2.6s; fill: #ffffff; }
    @keyframes tw { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.85; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s cubic-bezier(0.2, 0.6, 0.3, 1) infinite; }
    .pulse.late { animation-delay: 1.4s; }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(2.1); opacity: 0; } }
    .float { animation: float 7s ease-in-out infinite; }
    .float.b { animation-duration: 8s; animation-delay: -3s; }
    .float.c { animation-duration: 9s; animation-delay: -5s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .ahead { animation: march 1.6s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -26; } }
    .rays { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .typing circle { animation: typing 1.4s ease-in-out infinite; }
    .typing circle:nth-child(2) { animation-delay: 0.2s; }
    .typing circle:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 60%, 100% { opacity: 0.35; } 30% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c3d22"/>
      <stop offset="0.5" stop-color="#083119"/>
      <stop offset="1" stop-color="#052e16"/>
    </linearGradient>
    <radialGradient id="dawn" cx="400" cy="250" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.34"/>
      <stop offset="0.28" stop-color="#bef264" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#22c55e" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8f55"/>
      <stop offset="0.45" stop-color="#14532d"/>
      <stop offset="1" stop-color="#062d17"/>
    </linearGradient>
    <linearGradient id="faceR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c6b3c"/>
      <stop offset="0.45" stop-color="#0d4022"/>
      <stop offset="1" stop-color="#052812"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14532d" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#052e16" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4a28"/>
      <stop offset="1" stop-color="#041f0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.45" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <radialGradient id="starGlow">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="curGlow">
      <stop offset="0" stop-color="#86efac" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Bầu trời lúc rạng đông, sáng nhất sau đỉnh núi -->
  <rect width="800" height="1000" fill="url(#sky)"/>
  <rect width="800" height="1000" fill="url(#dawn)"/>
  <g><circle cx="92" cy="96" r="2.2" class="tw"/><circle cx="168" cy="182" r="1.6" class="tw d1"/><circle cx="250" cy="70" r="1.4" class="tw d2"/><circle cx="560" cy="92" r="1.8" class="tw"/><circle cx="668" cy="158" r="2.2" class="tw d1"/><circle cx="720" cy="64" r="1.4" class="tw d2"/><circle cx="128" cy="280" r="1.4" class="tw"/><circle cx="700" cy="300" r="1.6" class="tw d1"/><circle cx="56" cy="420" r="1.8" class="tw d2"/><circle cx="752" cy="470" r="1.4" class="tw"/><circle cx="612" cy="210" r="1.2" class="tw d1"/><circle cx="300" cy="150" r="1.2" class="tw d2"/></g>

  <!-- Vòng sáng quanh ngôi sao -->
  <g fill="none" stroke="#fde68a">
    <circle cx="400" cy="222" r="92" stroke-opacity="0.16"/>
    <circle cx="400" cy="222" r="150" stroke-opacity="0.09"/>
    <circle cx="400" cy="222" r="215" stroke-opacity="0.05"/>
  </g>

  <!-- Dãy đồi xa -->
  <path d="M-20 640 C60 600 130 548 200 560 C250 568 290 610 330 660 L330 1000 L-20 1000 Z" fill="url(#hillFar)"/>
  <path d="M820 610 C740 570 670 530 600 548 C550 560 510 600 470 650 L470 1000 L820 1000 Z" fill="url(#hillFar)"/>

  <!-- Dãy núi: đỉnh chính ở giữa, vai núi hai bên; khối chung trong bóng, mặt trái đón nắng -->
  <path d="M-20 820 C60 720 150 600 230 520 C270 480 300 470 330 420 C356 376 380 330 400 300 C420 330 440 360 470 390 C500 420 530 430 560 420 C600 410 640 470 700 560 C740 620 780 680 820 720 L820 1000 L-20 1000 Z" fill="url(#faceR)"/>
  <path d="M400 300 C380 330 356 376 330 420 C300 470 270 480 230 520 C150 600 60 720 -20 820 L-20 1000 L384 1000 C404 860 384 760 402 640 C414 560 392 470 408 400 C414 360 404 330 400 300 Z" fill="url(#faceL)"/>
  <!-- Vai núi phải hơi sáng hơn sườn khuất -->
  <path d="M560 420 C600 410 640 470 700 560 C740 620 780 680 820 720 L820 1000 L640 1000 C660 820 600 640 560 420 Z" fill="#1c6b3c" fill-opacity="0.2"/>
  <!-- Viền núi bắt ánh bình minh -->
  <path d="M-20 820 C60 720 150 600 230 520 C270 480 300 470 330 420 C356 376 380 330 400 300 C420 330 440 360 470 390 C500 420 530 430 560 420 C600 410 640 470 700 560" fill="none" stroke="#d9f99d" stroke-opacity="0.28" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Mũ tuyết -->
  <path d="M400 300 C394 309 387 319 380 330 L389 327 L394 335 L401 327 L409 337 L415 330 L424 335 C416 323 408 311 400 300 Z" fill="#f0fdf4" fill-opacity="0.85"/>

  <!-- Con đường -->
  <path d="M440 1020 C428.7 993.3 392.3 908.7 372 860 C351.7 811.3 299 763 318 728 C337 693 482.7 675.7 486 650 C489.3 624.3 342.7 598.5 338 574 C333.3 549.5 453.3 525.7 458 503 C462.7 480.3 371 458.5 366 438 C361 417.5 422.3 398.7 428 380 C433.7 361.3 404.7 335 400 326" fill="none" stroke="#021a0b" stroke-opacity="0.45" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M440 1020 C428.7 993.3 392.3 908.7 372 860 C351.7 811.3 299 763 318 728 C337 693 482.7 675.7 486 650 C489.3 624.3 342.7 598.5 338 574 C333.3 549.5 453.3 525.7 458 503 C462.7 480.3 371 458.5 366 438 C361 417.5 422.3 398.7 428 380 C433.7 361.3 404.7 335 400 326" fill="none" stroke="#86efac" stroke-opacity="0.1" stroke-width="11" stroke-linecap="round"/>
  <path class="ahead" d="M458 503 C462.7 480.3 371 458.5 366 438 C361 417.5 422.3 398.7 428 380 C433.7 361.3 404.7 335 400 326" fill="none" stroke="#86efac" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 11" stroke-linecap="round"/>
  <path d="M440 1020 C428.7 993.3 392.3 908.7 372 860 C351.7 811.3 299 763 318 728 C337 693 482.7 675.7 486 650 C489.3 624.3 342.7 598.5 338 574 C333.3 549.5 453.3 525.7 458 503" fill="none" stroke="#4ade80" stroke-width="9" stroke-opacity="0.45" stroke-linecap="round" filter="url(#soft)"/>
  <path id="done" d="M440 1020 C428.7 993.3 392.3 908.7 372 860 C351.7 811.3 299 763 318 728 C337 693 482.7 675.7 486 650 C489.3 624.3 342.7 598.5 338 574 C333.3 549.5 453.3 525.7 458 503" fill="none" stroke="#bbf7d0" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Đốm sáng chạy dọc đoạn đường đã đi -->
  <circle r="5" fill="#ffffff">
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1">
      <mpath href="#done"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Cột mốc chương -->
  
    <g>
      <circle cx="318" cy="728" r="17" fill="#22c55e" stroke="#bbf7d0" stroke-width="2"/>
      <path d="M311 728.5 l5 5 l9.5 -10" fill="none" stroke="#04170b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <circle cx="486" cy="650" r="17" fill="#22c55e" stroke="#bbf7d0" stroke-width="2"/>
      <path d="M479 650.5 l5 5 l9.5 -10" fill="none" stroke="#04170b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <circle cx="338" cy="574" r="17" fill="#22c55e" stroke="#bbf7d0" stroke-width="2"/>
      <path d="M331 574.5 l5 5 l9.5 -10" fill="none" stroke="#04170b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g>
      <circle class="pulse" cx="458" cy="503" r="22" fill="none" stroke="#86efac" stroke-width="2"/>
      <circle class="pulse late" cx="458" cy="503" r="22" fill="none" stroke="#86efac" stroke-width="2"/>
      <circle cx="458" cy="503" r="34" fill="url(#curGlow)"/>
      <circle cx="458" cy="503" r="21" fill="#f0fdf4" stroke="#4ade80" stroke-width="3"/>
      <text x="458" y="510" text-anchor="middle" class="num" fill="#14532d">4</text>
    </g>
    <g opacity="0.8">
      <circle cx="366" cy="438" r="14" fill="#0b3b20" stroke="#86efac" stroke-opacity="0.55" stroke-width="2"/>
      <text x="366" y="443" text-anchor="middle" class="num small" fill="#86efac">5</text>
    </g>
    <g opacity="0.6">
      <circle cx="428" cy="380" r="14" fill="#0b3b20" stroke="#86efac" stroke-opacity="0.55" stroke-width="2"/>
      <text x="428" y="385" text-anchor="middle" class="num small" fill="#86efac">6</text>
    </g>

  <!-- Ngôi sao trên đỉnh -->
  <circle cx="400" cy="222" r="96" fill="url(#starGlow)"/>
  <g class="rays" stroke="#fde68a" stroke-linecap="round" stroke-opacity="0.55">
    <line x1="462" y1="222" x2="484" y2="222" stroke-width="3"/><line x1="453.7" y1="253" x2="464.1" y2="259" stroke-width="2"/><line x1="431" y1="275.7" x2="442" y2="294.7" stroke-width="3"/><line x1="400" y1="284" x2="400" y2="296" stroke-width="2"/><line x1="369" y1="275.7" x2="358" y2="294.7" stroke-width="3"/><line x1="346.3" y1="253" x2="335.9" y2="259" stroke-width="2"/><line x1="338" y1="222" x2="316" y2="222" stroke-width="3"/><line x1="346.3" y1="191" x2="335.9" y2="185" stroke-width="2"/><line x1="369" y1="168.3" x2="358" y2="149.3" stroke-width="3"/><line x1="400" y1="160" x2="400" y2="148" stroke-width="2"/><line x1="431" y1="168.3" x2="442" y2="149.3" stroke-width="3"/><line x1="453.7" y1="191" x2="464.1" y2="185" stroke-width="2"/>
  </g>
  <polygon points="400,174 411.8,205.8 445.7,207.2 419,228.2 428.2,260.8 400,242 371.8,260.8 381,228.2 354.3,207.2 388.2,205.8" fill="url(#gold)" stroke="#fef3c7" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="400,198 405.3,212.7 420.9,213.2 408.6,222.8 412.9,237.8 400,229 387.1,237.8 391.4,222.8 379.1,213.2 394.7,212.7" fill="#fffbeb" fill-opacity="0.45"/>
  <line x1="400" y1="272" x2="400" y2="320" stroke="#fde68a" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>

  <!-- Thẻ: tiến độ 6 chương -->
  <g class="float" filter="url(#shadow)">
    <g transform="translate(80 300)">
      <rect width="152" height="104" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18"/>
      <rect x="22" y="28" width="11" height="52" rx="5.5" fill="#ffffff" fill-opacity="0.08"/><rect x="22" y="28" width="11" height="52" rx="5.5" fill="#4ade80"/><rect x="41" y="28" width="11" height="52" rx="5.5" fill="#ffffff" fill-opacity="0.08"/><rect x="41" y="28" width="11" height="52" rx="5.5" fill="#4ade80"/><rect x="60" y="28" width="11" height="52" rx="5.5" fill="#ffffff" fill-opacity="0.08"/><rect x="60" y="28" width="11" height="52" rx="5.5" fill="#4ade80"/><rect x="79" y="28" width="11" height="52" rx="5.5" fill="#ffffff" fill-opacity="0.08"/><rect x="79" y="54" width="11" height="26" rx="5.5" fill="#bbf7d0"/><rect x="98" y="28" width="11" height="52" rx="5.5" fill="#ffffff" fill-opacity="0.08"/><rect x="117" y="28" width="11" height="52" rx="5.5" fill="#ffffff" fill-opacity="0.08"/>
      <rect x="22" y="88" width="106" height="2" rx="1" fill="#ffffff" fill-opacity="0.12"/>
    </g>
  </g>

  <!-- Thẻ: giáo trình -->
  <g class="float c" filter="url(#shadow)">
    <g transform="translate(96 520) rotate(-6)">
      <rect width="128" height="88" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18"/>
      <g transform="translate(24 22)" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M40 8 C30 2 14 2 2 6 L2 42 C14 38 30 38 40 44 Z" fill="#f0fdf4" fill-opacity="0.9" stroke="#bbf7d0" stroke-width="2"/>
        <path d="M40 8 C50 2 66 2 78 6 L78 42 C66 38 50 38 40 44 Z" fill="#dcfce7" fill-opacity="0.9" stroke="#bbf7d0" stroke-width="2"/>
        <path d="M10 15 C18 13 26 13 33 16 M10 23 C18 21 26 21 33 24 M10 31 C16 29 22 29 27 31" stroke="#15803d" stroke-opacity="0.6" stroke-width="2.4"/>
        <path d="M47 16 C54 13 62 13 70 15 M47 24 C54 21 62 21 70 23" stroke="#15803d" stroke-opacity="0.6" stroke-width="2.4"/>
        <path d="M58 40 L58 54 L63 50 L68 54 L68 39" fill="#fbbf24" stroke="#fbbf24" stroke-width="1.5"/>
      </g>
    </g>
  </g>

  <!-- Bong bóng trợ lý, chỉ vào chặng đang học -->
  <g class="float b" filter="url(#shadow)">
    <g transform="translate(540 420)">
      <path d="M20 0 H140 A20 20 0 0 1 160 20 V48 A20 20 0 0 1 140 68 H40 L14 88 L20 68 A20 20 0 0 1 0 48 V20 A20 20 0 0 1 20 0 Z" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.2"/>
      <g class="typing" fill="#bbf7d0">
        <circle cx="56" cy="34" r="7"/>
        <circle cx="80" cy="34" r="7"/>
        <circle cx="104" cy="34" r="7"/>
      </g>
    </g>
  </g>

  <!-- Thẻ: vòng tiến độ 3/6 -->
  <g class="float c" filter="url(#shadow)">
    <g transform="translate(600 262)">
      <rect width="112" height="112" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="56" cy="56" r="32" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="8"/>
      <circle cx="56" cy="56" r="32" fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round"
        stroke-dasharray="100.5 400" transform="rotate(-90 56 56)"/>
      <text x="56" y="63" text-anchor="middle" class="num" fill="#f0fdf4">3/6</text>
    </g>
  </g>

  <!-- Đồi gần, che chân đường và làm nền tối cho thẻ lợi ích -->
  <path d="M-20 860 C120 800 260 790 380 830 C500 870 640 850 820 790 L820 1000 L-20 1000 Z" fill="url(#hillNear)"/>
</svg>
