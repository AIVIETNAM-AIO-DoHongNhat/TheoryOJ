[project]
name = "theoryoj-rag"
version = "0.1.0"
description = "Dịch vụ nạp tài liệu và tìm kiếm cho TheoryOJ"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "numpy",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Chạy bge-m3 và reranker trên máy. Không cần khi EMBED_PROVIDER=openrouter và RERANK_PROVIDER=openrouter.
local = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
