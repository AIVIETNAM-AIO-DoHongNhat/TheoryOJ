# Câu tự luận chương 6. Người phát triển soạn từ giáo trình, chờ giảng viên duyệt. Quy ước ở _mau.yaml.
subject: ktct
chapter: 6
status: nhap
questions:
  - id: tl6-01
    q: Phân tích tính tất yếu khách quan và nội dung của công nghiệp hóa, hiện đại hóa ở Việt Nam.
    rubric:
      - { id: y1, y: "Công nghiệp hóa là quá trình chuyển đổi nền sản xuất xã hội từ lao động thủ công sang sử dụng phổ biến sức lao động cùng công nghệ, phương tiện hiện đại", diem: 1.5, page: 145 }
      - { id: y2, y: "Công nghiệp hóa là quy luật phổ biến của sự phát triển lực lượng sản xuất xã hội", diem: 2, page: 148 }
      - { id: y3, y: "Với nước kém phát triển quá độ lên chủ nghĩa xã hội, công nghiệp hóa nhằm xây dựng cơ sở vật chất kỹ thuật của chủ nghĩa xã hội", diem: 2, page: 149 }
      - { id: y4, y: "Nội dung: tạo lập các điều kiện để chuyển đổi từ nền sản xuất – xã hội lạc hậu sang tiến bộ", diem: 2, page: 150 }
      - { id: y5, y: "Nội dung: thực hiện các nhiệm vụ chuyển đổi như ứng dụng khoa học công nghệ, chuyển dịch cơ cấu kinh tế, hoàn thiện quan hệ sản xuất", diem: 2.5, page: 151 }
  - id: tl6-02
    q: Phân tích tác động của hội nhập kinh tế quốc tế đến phát triển của Việt Nam và phương hướng nâng cao hiệu quả hội nhập.
    rubric:
      - { id: y1, y: "Khái niệm và tính tất yếu: gắn kết nền kinh tế quốc gia với thế giới trên cơ sở chia sẻ lợi ích, tuân thủ chuẩn mực chung; do xu thế toàn cầu hóa và là phương thức phát triển phổ biến", diem: 2, page: 157 }
      - { id: y2, y: "Tác động tích cực: mở rộng thị trường, thu hút vốn, công nghệ, nâng cao chất lượng nguồn nhân lực, thúc đẩy cải cách", diem: 2.5, page: 160 }
      - { id: y3, y: "Tác động tiêu cực: cạnh tranh gay gắt, lệ thuộc bên ngoài, phân hóa giàu nghèo, thách thức với chủ quyền, an ninh và bản sắc văn hóa", diem: 2.5, page: 161 }
      - { id: y4, y: "Phương hướng: nhận thức thời cơ, thách thức; xây dựng chiến lược, lộ trình; chủ động tham gia liên kết; hoàn thiện thể chế; nâng cao năng lực cạnh tranh", diem: 2, page: 162 }
      - { id: y5, y: "Xây dựng nền kinh tế độc lập, tự chủ, kết hợp kinh tế với quốc phòng, an ninh", diem: 1, page: 168 }
