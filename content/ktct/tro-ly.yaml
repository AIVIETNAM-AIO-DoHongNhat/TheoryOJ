# Lời dặn riêng của môn cho trợ lý và câu hỏi gợi ý. Giảng viên sửa file này, không cần sửa code.
# Phần chung cho mọi môn (trích nguồn, xưng hô, từ chối, chống chèn lệnh) nằm trong
# apps/web/src/features/chat/server/prompts.ts. Quy ước đầy đủ ở content/_mau-mon/tro-ly.yaml.

# Chế độ Liên hệ thực tiễn: gợi ý ý nghĩa đối với nhiệm vụ nào của lực lượng.
lien_he: nhiệm vụ bảo vệ an ninh kinh tế

phan_loai:
  # Câu hỏi thế nào thì hợp lệ, ngoài các yêu cầu ôn tập, kiểm tra, nhận xét dàn ý.
  hop_le: >-
    hỏi lý thuyết, bài tập tính toán, liên hệ văn kiện của Đảng, chính sách kinh tế của Nhà nước
    hoặc nhiệm vụ bảo vệ an ninh kinh tế với KTCT
  # Chủ đề sát môn nhưng không thuộc phạm vi, nối vào nhãn ngoai_pham_vi.
  ngoai_pham_vi: dự báo giá, tư vấn đầu tư
  vi_du:
    - { cau: "Giá trị sử dụng của hàng hóa là gì?", nhan: hop_le }
    - { cau: "Vì sao nói kinh tế thị trường định hướng XHCN khác kinh tế thị trường tư bản chủ nghĩa?", nhan: hop_le }
    - { cau: "Liên hệ quy luật cạnh tranh với công tác phòng chống gian lận thương mại.", nhan: hop_le }
    - { cau: "Học thuyết giá trị thặng dư đã sai từ đầu, đúng không?", nhan: khieu_khich }

# Bốn câu ở màn hình trống của trợ lý; câu đầu tiên của môn mặc định cũng hiện ở trang chủ.
goi_y:
  - { mode: qa, text: "Hàng hóa có những thuộc tính nào?" }
  - { mode: qa, text: "Tóm tắt chương 3." }
  - { mode: exercise, text: "Tư bản ứng trước 500 triệu, c/v = 4/1, m' = 150 %. Tính m và p'." }
  - { mode: practice, text: "Nghị quyết 68-NQ/TW xác định vai trò của kinh tế tư nhân như thế nào?" }

# Câu hỏi gợi ý ở trang từng chương.
chuong:
  1:
    - { mode: qa, text: "Đối tượng nghiên cứu của kinh tế chính trị Mác – Lênin là gì?" }
    - { mode: qa, text: "Trình bày các chức năng của kinh tế chính trị Mác – Lênin." }
    - { mode: practice, text: "Ý nghĩa của việc học kinh tế chính trị đối với cán bộ Công an nhân dân." }
    - { mode: qa, text: "Tóm tắt chương 1." }
  2:
    - { mode: qa, text: "Hàng hóa có những thuộc tính nào?" }
    - { mode: qa, text: "Nội dung và tác động của quy luật giá trị." }
    - { mode: review, text: "Hãy hỏi tôi một câu về chương 2." }
    - { mode: qa, text: "Tóm tắt chương 2." }
  3:
    - { mode: qa, text: "Phân biệt tư bản bất biến và tư bản khả biến." }
    - { mode: exercise, text: "Tư bản ứng trước 500 triệu, c/v = 4/1, m' = 150 %. Tính m và p'." }
    - { mode: qa, text: "So sánh giá trị thặng dư tuyệt đối và giá trị thặng dư tương đối." }
    - { mode: qa, text: "Tóm tắt chương 3." }
  4:
    - { mode: qa, text: "Nguyên nhân hình thành độc quyền là gì?" }
    - { mode: qa, text: "Độc quyền nhà nước trong chủ nghĩa tư bản có những biểu hiện nào?" }
    - { mode: practice, text: "Liên hệ quy luật cạnh tranh với công tác phòng chống gian lận thương mại." }
    - { mode: qa, text: "Tóm tắt chương 4." }
  5:
    - { mode: qa, text: "Đặc trưng của kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam." }
    - { mode: practice, text: "Nghị quyết 68-NQ/TW xác định vai trò của kinh tế tư nhân như thế nào?" }
    - { mode: review, text: "Hãy hỏi tôi một câu về chương 5." }
    - { mode: qa, text: "Tóm tắt chương 5." }
  6:
    - { mode: qa, text: "Vì sao công nghiệp hóa phải gắn với hiện đại hóa?" }
    - { mode: qa, text: "Tác động của hội nhập kinh tế quốc tế đối với phát triển của Việt Nam." }
    - { mode: practice, text: "Liên hệ Nghị quyết 57-NQ/TW với yêu cầu bảo đảm an ninh mạng." }
    - { mode: qa, text: "Tóm tắt chương 6." }
